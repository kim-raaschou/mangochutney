# A Mac set of mango's bindings: mango's default bindings, in mango's order, on the Hyper
# layer (HYPER = chutney_hyper_modifier, Control+Option+Command by default), so they take no
# app shortcut (Command), no Option character and no Spaces switch (Control+arrows).
# To use it, replace the bind, mousebind, axisbind and gesturebind lines of config.conf with
# this file. Two lines move every binding to other modifiers: var=mod and var=mods.
var=mod,HYPER
var=mods,HYPER+SHIFT

# reload config
bind=$mod,r,reload_config

# menu and terminal (mango: Alt,Return,spawn,foot)
bind=$mod,Return,spawn,open -na Ghostty || open -na Terminal

# exit
bind=$mod,m,quit
bind=$mod,q,killclient,

# switch window focus
bind=$mod,Tab,focusstack,next
bind=$mod,Left,focusdir,left
bind=$mod,Right,focusdir,right
bind=$mod,Up,focusdir,up
bind=$mod,Down,focusdir,down

# move window
bind=$mods,Up,move_client,up
bind=$mods,Down,move_client,down
bind=$mods,Left,move_client,left
bind=$mods,Right,move_client,right

# switch window status
bind=$mod,g,toggleglobal,
bind=$mods,Tab,togglejump,
bind=$mod,backslash,togglefloating,
bind=$mod,a,togglemaximizescreen,
bind=$mod,f,togglefullscreen,
bind=$mods,f,togglefakefullscreen,
bind=$mod,i,minimized,
bind=$mod,o,toggleoverlay,
bind=$mods,I,restore_minimized
bind=$mod,z,toggle_scratchpad

# scroller layout
bind=$mod,e,set_proportion,1.0
bind=$mod,x,switch_proportion_preset,

# dwindle layout (manual split mode)
bind=$mods,Return,dwindle_toggle_split_direction

# switch layout
bind=$mod,n,switch_layout

# tag switch (mango: Super/Ctrl + Left/Right; arrows focus here, so comma and period)
bind=$mod,comma,viewtoleft_have_client,0
bind=$mod,period,viewtoright_have_client,0
bind=$mods,comma,tagtoleft,0
bind=$mods,period,tagtoright,0

# view a tag (mango: Ctrl,1..9)
bind=$mod,1,view,1,0
bind=$mod,2,view,2,0
bind=$mod,3,view,3,0
bind=$mod,4,view,4,0
bind=$mod,5,view,5,0
bind=$mod,6,view,6,0
bind=$mod,7,view,7,0
bind=$mod,8,view,8,0
bind=$mod,9,view,9,0

# send the window to a tag (mango: Alt,1..9)
bind=$mods,1,tag,1,0
bind=$mods,2,tag,2,0
bind=$mods,3,tag,3,0
bind=$mods,4,tag,4,0
bind=$mods,5,tag,5,0
bind=$mods,6,tag,6,0
bind=$mods,7,tag,7,0
bind=$mods,8,tag,8,0
bind=$mods,9,tag,9,0

# monitor switch (mango: alt+shift / Super+Alt + Left/Right)
bind=$mod,bracketleft,focusmon,left
bind=$mod,bracketright,focusmon,right
bind=$mods,bracketleft,tagmon,left
bind=$mods,bracketright,tagmon,right

# gaps
bind=$mods,X,incgaps,1
bind=$mods,Z,incgaps,-1
bind=$mods,R,togglegaps

# movewin, resizewin and scroller_stack (mango: Ctrl+Shift, Ctrl+Alt and Alt+Super+Ctrl +
# arrows) in a key mode: $mod+w, then the arrows; Escape or Return leaves it.
bind=$mod,w,setkeymode,window
key_mode=window
bind=shift,Up,movewin,+0,-50
bind=shift,Down,movewin,+0,+50
bind=shift,Left,movewin,-50,+0
bind=shift,Right,movewin,+50,+0
bind=none,Up,resizewin,+0,-50
bind=none,Down,resizewin,+0,+50
bind=none,Left,resizewin,-50,+0
bind=none,Right,resizewin,+50,+0
bind=ctrl,Left,scroller_stack,left
bind=ctrl,Right,scroller_stack,right
bind=ctrl,Up,scroller_stack,up
bind=ctrl,Down,scroller_stack,down
bind=none,Escape,setkeymode,default
bind=none,Return,setkeymode,default
key_mode=default

# Mouse Button Bindings (mango's plain middle click, maximize, would be taken from every app)
mousebind=$mod,btn_left,moveresize,curmove
mousebind=$mod,btn_right,moveresize,curresize

# Axis Bindings
axisbind=$mod,UP,viewtoleft_have_client
axisbind=$mod,DOWN,viewtoright_have_client

# Gesture Bindings: macOS uses 3- and 4-finger swipes for Spaces and Mission Control; turn
# those off in System Settings (Trackpad, More Gestures) before adding mango's.
