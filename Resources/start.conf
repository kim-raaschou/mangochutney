# Your first lines of config. Take away the # in front of a line and save (⌘S): Mango Chutney
# reads the config again at once, and you see the change. Put the # back to undo it.
#
# Remember two keys: Hyper K lists every key binding, Hyper L picks a layout.
#
# config.conf reads this file (source_optional=start.conf). Every key here is mango's:
# https://mangowm.github.io/docs/ has them all.

# 1. More room between the windows (config.conf has 5 and 10).
# gap_inner_horizontal=20
# gap_inner_vertical=20
# gap_outer_horizontal=30
# gap_outer_vertical=30

# 2. A wider border (config.conf has 4).
# border_px=8

# 3. Another colour for the focused window's border, as 0xRRGGBBAA.
# focus_color=0xff5f57ff

# 4. Tag 2 in the scroller layout: the windows side by side in columns.
# tag_rule=id:2,layout_name:scroller

# 5. Hyper T opens Terminal. Hyper is Caps Lock held (it acts as ⌃⌥⌘).
# bind=HYPER,t,spawn,open -a Terminal
