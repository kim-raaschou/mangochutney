# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0
monocle_no_radius=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=4
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# not mango default: from here to "end not mango default" below the axis bindings. mango's
# keys on Hyper, so they take no macOS or app shortcut: $mod is Hyper, $mods Hyper+Shift;
# mango binds SUPER, ALT and CTRL. Where a key moved, its comment says mango's (mango: ...).
# Left out: mango's Alt,space,spawn,rofi -show drun (no rofi on macOS).
var=mod,HYPER
var=mods,HYPER+SHIFT

# reload config
bind=$mod,r,reload_config

# menu and terminal (mango: Alt,Return,spawn,foot)
bind=$mod,Return,spawn,open -na Ghostty || open -na Terminal

# exit
bind=$mod,m,quit
bind=$mod,q,killclient,

# switch window focus
bind=$mod,Tab,focusstack,next
bind=$mod,Left,focusdir,left
bind=$mod,Right,focusdir,right
bind=$mod,Up,focusdir,up
bind=$mod,Down,focusdir,down

# move window
bind=$mods,Up,move_client,up
bind=$mods,Down,move_client,down
bind=$mods,Left,move_client,left
bind=$mods,Right,move_client,right

# switch window status
bind=$mod,g,toggleglobal,
bind=$mods,Tab,togglejump,
bind=$mod,backslash,togglefloating,
bind=$mod,a,togglemaximizescreen,
bind=$mod,f,togglefullscreen,
bind=$mods,f,togglefakefullscreen,
bind=$mod,i,minimized,
bind=$mod,o,toggleoverlay,
bind=$mods,I,restore_minimized
bind=$mod,z,toggle_scratchpad

# scroller layout
bind=$mod,e,set_proportion,1.0
bind=$mod,x,switch_proportion_preset,

# dwindle layout (manual split mode)
bind=$mods,Return,dwindle_toggle_split_direction

# switch layout
bind=$mod,n,switch_layout

# tag switch (mango: Super/Ctrl + Left/Right; arrows focus here, so comma and period)
bind=$mod,comma,viewtoleft_have_client,0
bind=$mod,period,viewtoright_have_client,0
bind=$mods,comma,tagtoleft,0
bind=$mods,period,tagtoright,0

# view a tag (mango: Ctrl,1..9)
bind=$mod,1,view,1,0
bind=$mod,2,view,2,0
bind=$mod,3,view,3,0
bind=$mod,4,view,4,0
bind=$mod,5,view,5,0
bind=$mod,6,view,6,0
bind=$mod,7,view,7,0
bind=$mod,8,view,8,0
bind=$mod,9,view,9,0

# send the window to a tag (mango: Alt,1..9)
bind=$mods,1,tag,1,0
bind=$mods,2,tag,2,0
bind=$mods,3,tag,3,0
bind=$mods,4,tag,4,0
bind=$mods,5,tag,5,0
bind=$mods,6,tag,6,0
bind=$mods,7,tag,7,0
bind=$mods,8,tag,8,0
bind=$mods,9,tag,9,0

# monitor switch (mango: alt+shift / Super+Alt + Left/Right)
bind=$mod,bracketleft,focusmon,left
bind=$mod,bracketright,focusmon,right
bind=$mods,bracketleft,tagmon,left
bind=$mods,bracketright,tagmon,right

# gaps
bind=$mods,X,incgaps,1
bind=$mods,Z,incgaps,-1
bind=$mods,R,togglegaps

# movewin, resizewin and scroller_stack (mango: Ctrl+Shift, Ctrl+Alt and Alt+Super+Ctrl +
# arrows) in a key mode: $mod+w, then the arrows; Escape or Return leaves it.
bind=$mod,w,setkeymode,window
key_mode=window
bind=shift,Up,movewin,+0,-50
bind=shift,Down,movewin,+0,+50
bind=shift,Left,movewin,-50,+0
bind=shift,Right,movewin,+50,+0
bind=none,Up,resizewin,+0,-50
bind=none,Down,resizewin,+0,+50
bind=none,Left,resizewin,-50,+0
bind=none,Right,resizewin,+50,+0
bind=ctrl,Left,scroller_stack,left
bind=ctrl,Right,scroller_stack,right
bind=ctrl,Up,scroller_stack,up
bind=ctrl,Down,scroller_stack,down
bind=none,Escape,setkeymode,default
bind=none,Return,setkeymode,default
key_mode=default

# Mouse Button Bindings (left out: mango's NONE,btn_middle,togglemaximizescreen,0; a plain
# middle click would be taken from every app)
mousebind=$mod,btn_left,moveresize,curmove
mousebind=$mod,btn_right,moveresize,curresize

# Axis Bindings
axisbind=$mod,UP,viewtoleft_have_client
axisbind=$mod,DOWN,viewtoright_have_client
# end not mango default


# Gesture Bindings
# not mango default: from here to "end not mango default", a note for macOS
# Mango Chutney: turn off macOS's 3- and 4-finger swipes (Trackpad, More Gestures) first.
# end not mango default
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# not mango default: from here to the end, the macOS port's own keys (chutney_*), bindings
# and files. All keys and their defaults: docs/guide.md.

# HYPER in a bind is ⌃⌥⌘ held. One key held as Hyper: chutney_hyper_key=caps_lock (or a
# left_/right_ control, shift, option, command, or f1 … f12); Caps Lock or a function key
# pressed alone: chutney_hyper_tap=none, original or escape
# chutney_hyper_modifier=super+ctrl+alt
# The key held as Hyper, chosen on the first start. Hyper from a keyboard of its own:
# delete this line. A key chosen in Settings (⌘, in the menu bar) is kept in chutney_menu.conf
# and wins over this line.
chutney_hyper_key=caps_lock

# Menu bar; the menu's choices are saved in chutney_menu.conf
chutney_menu_bar=1
chutney_menu_config=chutney_menu.conf

# Palettes
bind=HYPER,k,chutney_toggle_hotkeys_palette
bind=HYPER,l,chutney_toggle_layout_palette

# Escape leaves the overview, and still reaches the app (mango: only in jump mode)
bindp=NONE,Escape,leaveoverview

# Look
chutney_style=1
chutney_tab_bar_app_icons=1
chutney_tab_bar_shortcuts=1

# Written by Mango Chutney, not for editing: macOS's colours (chutney_style).
source_optional=chutney_theme.conf

# Your own settings and bindings: here, after macOS's colours (so a colour of yours wins) and
# before the menu's choices. To begin, take away the # in front of a line and save (⌘S):
# Mango Chutney reads the config again at once. Put the # back to undo it. Every key is
# mango's: https://mangowm.github.io/docs/ has them all.
# Remember two keys: Hyper K lists every key binding, Hyper L picks a layout.

# 1. More room between the windows (above: 5 and 10).
# gap_inner_horizontal=20
# gap_inner_vertical=20
# gap_outer_horizontal=30
# gap_outer_vertical=30

# 2. A wider border (above: 4).
# border_px=8

# 3. Another colour for the focused window's border, as 0xRRGGBBAA.
# focus_color=0xff5f57ff

# 4. Tag 2 in the scroller layout: the windows side by side in columns.
# tag_rule=id:2,layout_name:scroller

# 5. Hyper T opens Terminal. Hyper is the key you chose (it acts as ⌃⌥⌘).
# bind=HYPER,t,spawn,open -a Terminal

# Written by Mango Chutney, not for editing: the menu's choices, last so they win.
source_optional=chutney_menu.conf
