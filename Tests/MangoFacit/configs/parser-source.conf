# source and source_optional: variables and the keymode are shared with a sourced file; a missing file is an error only for source
key_mode=resize
source=./sourced/extra.conf
gap_inner_vertical=$g
source_optional=./sourced/does-not-exist.conf
source=./sourced/missing.conf
source=./sourced/bad.conf
bind=$m,b,quit
key_mode=default
bind=SUPER,a,killclient
key_mode=resize
bind=SUPER,b,killclient
