# window, monitor, tag, layer and device rules, well and badly formed
window_rule=isfloating:1,appid:foot
window_rule=isfloating:1,title:^a$,width:800,height:600
window_rule=nosuchfield:1,title:a
window_rule=isfloating
window_rule=offsetx:abc,title:b
window_rule=tags:0,title:c
monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:60
monitor_rule=name:HDMI-A-2,x:0
monitor_rule=name:HDMI-A-3,width:1920
monitor_rule=name:HDMI-A-4,custom:1,width:1920
monitor_rule=name:HDMI-A-5,scale:abc,nosuchkey:1
monitor_rule=badformat
tag_rule=id:1,layout_name:scroller
tag_rule=id:abc,layout_name:tile
tag_rule=id:2,layout_name:nosuchlayout
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=nosuchfield:1
device_rule=type:keyboard,name:foo,xkb_rules_layout:us
device_rule=type:nosuchtype,name:foo
device_rule=type:pointer,nosuchoption:1
device_rule=garbage
