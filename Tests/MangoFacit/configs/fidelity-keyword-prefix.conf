# keywords are matched by their prefix: each of these makes a binding (the conflicts show them); bind| reports its flag and binds
envfoo=A,b
exec_once_later=echo hi
mousebindx=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_left,moveresize,curresize
axisbindx=SUPER,up,viewtoleft
axisbind=SUPER,up,viewtoright
gesturebindx=none,left,3,focusdir,left
gesturebind=none,left,3,focusdir,right
bind|=SUPER,a,quit
bind=SUPER,a,killclient
