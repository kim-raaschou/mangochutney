# key binding conflicts: sorted by modifier and key, bindc only against a plain bind, common against every mode
bind=SUPER,a,quit
bind=SUPER,a,killclient
bindc=SUPER,b,quit
bindc=SUPER,b,killclient
bindc=SUPER,c,quit
bind=SUPER,c,killclient
bind=SUPER+SHIFT,a,quit
key_mode=other
bind=SUPER,a,quit
key_mode=common
bind=SUPER,x,quit
key_mode=other
bind=SUPER,x,quit
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_left,moveresize,curresize
