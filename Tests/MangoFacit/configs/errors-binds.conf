# bindings of every kind, well and badly formed
# ours (binds match the port's key codes, not keysyms: docs/afvigelser.md §3):
# ours: drop [ERROR]: Key 'F13' has no keycode in the configured layouts; it is matched by keysym, which depends on the active layout
bind=SUPER,Return,spawn,foot
bind=SUPER,j
bind=SUPER
bind=,j,focusstack,next
bind=SUPER+SHIFT+CTRL+ALT,k,focusstack,prev
binds=SUPER,a,togglefloating
bindl=SUPER,b,togglefullscreen
bindr=SUPER,Super_L,toggleoverview
bindp=SUPER,c,minimized
bindsl=SUPER,d,restore_minimized
bindx=SUPER,e,killclient
bind=SUPER,code:24,killclient
bind=SUPER,code:abc,killclient
bind=SUPER,F13,killclient
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_nosuch,moveresize,curmove
mousebind=SUPER,code:272,moveresize,curresize
mousebind=SUPER
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,SIDEWAYS,viewtoleft_have_client
axisbind=SUPER,DOWN
gesturebind=none,left,3,viewtoleft_have_client
gesturebind=none,sideways,3,viewtoleft_have_client
gesturebind=none,up,x,toggleoverview
switchbind=fold,spawn,foo
