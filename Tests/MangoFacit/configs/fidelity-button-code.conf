# a mouse button as code:<n>: a word or a negative number is an error, 272 is the left button and +273 the right (the conflicts show them)
mousebind=SUPER,code:abc,killclient
mousebind=SUPER,code:-1,killclient
mousebind=SUPER,code:272,killclient
mousebind=SUPER,btn_left,togglefloating
mousebind=SUPER,code:+273,killclient
mousebind=SUPER,btn_right,togglefloating
