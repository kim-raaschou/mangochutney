name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Tests
        run: make test
      - name: Default config loads with the new parser
        run: make check CONFIG=debug   # reuses the test build instead of a second, release one
